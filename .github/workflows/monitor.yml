name: ecommerce-monitor

on:
  schedule:
    - cron: "0 6 * * *"       # daily 06:00 UTC — status/social/prices tracked day over day
  workflow_dispatch: {}       # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write             # needed to commit reports + state + history back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # belt-and-braces: never hang until GitHub's 6h kill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitors
        # Delivery is opt-in: unset repo secrets arrive as empty strings and
        # deliver() skips those channels. META_AD_TOKEN unlocks ad counts.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          META_AD_TOKEN: ${{ secrets.META_AD_TOKEN }}
        run: python run_all.py --days 7 --outdir reports

      - name: Refresh monthly export
        run: python export_monthly.py

      - name: Commit reports + state + history
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A reports exports history price_state.json
          git commit -m "chore: daily intel update [skip ci]" || echo "no changes"
          git push

      - name: Deploy dashboard to Vercel
        # Runs only when VERCEL_TOKEN secret is configured.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_oPmYC0gFOPcSxpUhXQ7SevX4
          VERCEL_PROJECT_ID: prj_CxyguwT9Boq7BrNVEWjnrZs9JQn1
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx --yes vercel deploy reports --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not set — skipping deploy"
          fi
